name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: |
          go vet ./...
          GOOS=windows go vet ./cmd/link-site
          GOOS=darwin go vet ./cmd/link-site
      - name: Build every platform
        env:
          CGO_ENABLED: "0"
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/link-site
          done
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch go build -o /dev/null ./cmd/link-hub
          done
      - name: No em dashes
        run: |
          dash="$(printf '\342\200\224')"
          if grep -rIn "$dash" --exclude-dir=.git . ; then
            echo "Em dashes are not used in this repository."; exit 1
          fi
